<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JEONGMAL BAEGOPA 🍕🍔🍗🥯</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

/* ===== LOCK SCREEN ===== */
#lockscreen{
    position:absolute;
    width:100%;
    height:100svh;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    color:white;

    background:
        radial-gradient(circle at 20% 20%, #ffd6e0, transparent 40%),
        radial-gradient(circle at 80% 30%, #c7d2fe, transparent 45%),
        radial-gradient(circle at 50% 80%, #fbcfe8, transparent 40%),
        linear-gradient(135deg,#0f172a,#111827);
}

.time{
    font-size:70px;
    font-weight:200;
}

.date{
    margin-top:10px;
    color:#cbd5e1;
}

.swipe{
    position:absolute;
    bottom:40px;
    font-size:14px;
    color:#94a3b8;
}

/* ===== APP ===== */
#app{
    display:none;
    height:100svh;
    flex-direction:column;

    background:
        radial-gradient(circle at 20% 20%, #1f2937, transparent 60%),
        radial-gradient(circle at 80% 70%, #0b0f1a, transparent 60%),
        linear-gradient(180deg,#0b0f1a,#0f172a);
}

/* header */
.header{
    background:#1f2937;
    color:white;
    text-align:center;
    padding:14px;
    font-weight:600;
}

/* chat */
.messages{
    flex:1;
    padding:15px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:10px;
}

/* message row */
.msg-row{
    display:flex;
    align-items:flex-end;
    gap:8px;
}

/* avatar */
.avatar{
    width:28px;
    height:28px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:14px;
    background:#374151;
    color:white;
}

/* bubble */
.msg{
    max-width:75%;
    padding:10px 14px;
    border-radius:18px;
    font-size:14px;
    line-height:1.4;
}

.left{
    background:#374151;
    color:white;
    border-bottom-left-radius:5px;
}

.right{
    background:#2563eb;
    color:white;
    align-self:flex-end;
    border-bottom-right-radius:5px;
}

/* input */
.inputArea{
    display:flex;
    padding:10px;
    background:#1f2937;
    gap:10px;
}

input{
    flex:1;
    padding:12px;
    border-radius:20px;
    border:none;
    outline:none;
    background:#111827;
    color:white;
}

button{
    padding:10px 14px;
    border:none;
    border-radius:20px;
    background:#2563eb;
    color:white;
}
</style>
</head>

<body>

<!-- LOCK SCREEN -->
<div id="lockscreen" onclick="unlock()">

    <div class="time" id="time">9:41</div>
    <div class="date">JEONGMAL BAEGOPA 🍕🍔🍗🥯</div>

    <div class="swipe">Tap to unlock</div>
</div>

<!-- APP -->
<div id="app">

<div class="header">JEONGMAL BAEGOPA 🍕🍔🍗🥯</div>

<div class="messages" id="chat"></div>

<div class="inputArea">
    <input id="input" placeholder="Message..." />
    <button onclick="send()">Send</button>
</div>

</div>

<script>

const chat = document.getElementById("chat");

/* ===== TIME ===== */
function updateTime(){
    const now = new Date();
    let h = now.getHours();
    let m = now.getMinutes();
    if(m < 10) m = "0"+m;
    document.getElementById("time").innerText = h+":"+m;
}
setInterval(updateTime,1000);
updateTime();

/* ===== AVATARS ===== */
function avatar(name){
    if(name==="Baq") return "🐻";
    if(name==="Bat") return "🦇";
    if(name==="Mizah") return "🙈";
    if(name==="Syikin") return "🐣";
}

/* ===== MESSAGE ===== */
function addMsg(text, side, name=null){

    const row = document.createElement("div");
    row.classList.add("msg-row");

    const bubble = document.createElement("div");
    bubble.classList.add("msg", side);
    bubble.innerText = text;

    if(side === "left"){
        const av = document.createElement("div");
        av.classList.add("avatar");
        av.innerText = avatar(name);

        row.appendChild(av);
        row.appendChild(bubble);
    } else {
        row.style.justifyContent = "flex-end";
        row.appendChild(bubble);
    }

    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
}

/* ===== STORY STATE ===== */
let stage = 1;

/* ===== UNLOCK ===== */
function unlock(){
    document.getElementById("lockscreen").style.display = "none";
    document.getElementById("app").style.display = "flex";

    setTimeout(()=>intro(),600);
}

/* ===== INTRO (ALL REPLY) ===== */
function intro(){
    addMsg("Baq 🐻 Cyg: Hey… you’re here 🫂","left","Baq");
    setTimeout(()=>addMsg("Bat 🦇 Cyg: We missed you ❤️","left","Bat"),700);
    setTimeout(()=>addMsg("Mizah 🙈 Cyg: Talk to us okay 🥺","left","Mizah"),1400);
    setTimeout(()=>addMsg("Syikin 🐣 Cyg: We’re staying with you 💙","left","Syikin"),2100);
}

/* ===== SEND ===== */
function send(){
    const input = document.getElementById("input");
    const text = input.value.trim();
    if(!text) return;

    addMsg(text,"right");
    input.value="";

    setTimeout(()=>reply(text),900);
}

/* ===== EMOTIONAL GROUP STORY MODE ===== */
function reply(text){

    const t = text.toLowerCase();

    /* ===== STAGE 1 ===== */
    if(stage === 1){

        if(t.includes("sad") || t.includes("tired") || t.includes("stress")){

            addMsg("Baq 🐻 Cyg: Breathe slowly… I’m here 🫂","left","Baq");

            setTimeout(()=>addMsg("Bat 🦇 Cyg: You don’t have to carry this alone ❤️","left","Bat"),700);
            setTimeout(()=>addMsg("Mizah 🙈 Cyg: It’s okay… really 🥺","left","Mizah"),1400);
            setTimeout(()=>addMsg("Syikin 🐣 Cyg: We’re right here with you 💙","left","Syikin"),2100);

            stage = 2;
            return;
        }
    }

    /* ===== STAGE 2 ===== */
    if(stage === 2){

        if(t.includes("alone")){

            addMsg("Baq 🐻 Cyg: You are never alone 🫂","left","Baq");
            setTimeout(()=>addMsg("Bat 🦇 Cyg: Even in silence, we stay ❤️","left","Bat"),700);
            setTimeout(()=>addMsg("Mizah 🙈 Cyg: Please don’t shut us out 🥺","left","Mizah"),1400);
            setTimeout(()=>addMsg("Syikin 🐣 Cyg: We’re still here 💙","left","Syikin"),2100);

            stage = 3;
            return;
        }

        if(t.includes("cry")){

            addMsg("Mizah 🙈 Cyg: It’s okay to cry 🥺","left","Mizah");
            setTimeout(()=>addMsg("Syikin 🐣 Cyg: We’ll stay until you feel better 💙","left","Syikin"),700);
            setTimeout(()=>addMsg("Bat 🦇 Cyg: Let it out ❤️","left","Bat"),1400);
            setTimeout(()=>addMsg("Baq 🐻 Cyg: You’re safe 🫂","left","Baq"),2100);

            stage = 3;
            return;
        }
    }

    /* ===== STAGE 3 ===== */
    if(stage === 3){

        addMsg("Baq 🐻 Cyg: We’re proud of you 🫂","left","Baq");
        setTimeout(()=>addMsg("Bat 🦇 Cyg: You’re stronger than you think ❤️","left","Bat"),700);
        setTimeout(()=>addMsg("Mizah 🙈 Cyg: You matter so much 🥺","left","Mizah"),1400);
        setTimeout(()=>addMsg("Syikin 🐣 Cyg: We love you 💙","left","Syikin"),2100);

        stage = 4;
        return;
    }

    /* ===== STAGE 4 ===== */
    if(stage === 4){

        addMsg("Baq 🐻 Cyg: We’re not going anywhere 🫂","left","Baq");
        setTimeout(()=>addMsg("Bat 🦇 Cyg: Stay with us ❤️","left","Bat"),700);
        setTimeout(()=>addMsg("Mizah 🙈 Cyg: You’re safe here 🥺","left","Mizah"),1400);
        setTimeout(()=>addMsg("Syikin 🐣 Cyg: Always with you 💙","left","Syikin"),2100);

        return;
    }

    /* ===== DEFAULT ===== */
    const group = [
        {n:"Baq", t:"Baq 🐻 Cyg: I hear you 🫂"},
        {n:"Bat", t:"Bat 🦇 Cyg: Talk to us ❤️"},
        {n:"Mizah", t:"Mizah 🙈 Cyg: We’re listening 🥺"},
        {n:"Syikin", t:"Syikin 🐣 Cyg: We’re here 💙"}
    ];

    const r = group[Math.floor(Math.random()*group.length)];
    addMsg(r.t,"left",r.n);
}

</script>

</body>
</html>
